<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>統一發票中獎查詢</title>
<style>
  :root{
    --navy:#1A305E;
    --blue:#2B63AF;
    --teal:#58C0C6;
    --white:#FFFFFF;
    --paper-line:#E3E8EF;
    --dash:#D9E0EA;
    --grey:#5A6B85;
    --faint:#94A3B8;
    --on-navy:#AFC3DE;
    --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--navy);color:var(--white);font-family:var(--sans);
    -webkit-text-size-adjust:100%;min-height:100vh;
    padding:34px 18px calc(44px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:420px}

  h1{font-size:23px;font-weight:600;line-height:1.3;margin:0}
  .period{color:var(--teal);font-size:13px;letter-spacing:.06em;margin:6px 0 0}
  .lede{color:var(--on-navy);font-size:13px;line-height:1.8;margin:14px 0 0}

  .card{background:var(--white);border-radius:12px;margin:20px 0 0;overflow:hidden}
  .card-top{padding:20px 18px}
  label{display:block;color:var(--grey);font-size:11px;letter-spacing:.14em;margin:0 0 9px}
  input{
    width:100%;border:0;border-bottom:2px solid var(--blue);background:transparent;
    color:var(--navy);font-family:var(--mono);font-size:24px;
    font-variant-numeric:tabular-nums;letter-spacing:.05em;
    padding:2px 0 9px;border-radius:0;
  }
  input::placeholder{color:#C3CBD6}
  input:focus{outline:none}
  input:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
  .hint{min-height:18px;font-size:12.5px;color:#B0472C;line-height:1.5;margin:9px 0 0}
  button{
    width:100%;margin:14px 0 0;padding:14px;border:0;border-radius:8px;
    background:var(--blue);color:var(--white);font-family:var(--sans);
    font-size:15px;font-weight:600;letter-spacing:.12em;cursor:pointer;
  }
  button:disabled{background:#8CA3C4;cursor:default}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

  .stub{overflow:hidden;max-height:0;transition:max-height .45s cubic-bezier(.22,.7,.2,1)}
  .stub.open{max-height:1400px}
  .stub-inner{
    border-top:2px dashed var(--dash);margin:0 18px;padding:18px 0 22px;
    opacity:0;transform:translateY(-8px);
    transition:opacity .4s .1s ease-out,transform .4s .1s ease-out;
  }
  .stub.open .stub-inner{opacity:1;transform:none}

  .res-title{color:var(--navy);font-size:17px;font-weight:600;margin:0}
  .total{display:flex;align-items:baseline;gap:9px;margin:8px 0 0}
  .total span{color:var(--grey);font-size:12.5px}
  .total strong{
    color:var(--navy);font-family:var(--mono);font-size:27px;font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .rule{height:3px;width:44px;background:var(--teal);border-radius:2px;margin:11px 0 0}

  .item{border-top:1px solid var(--paper-line);margin:14px 0 0;padding:11px 0 0}
  .item:first-of-type{margin-top:16px}
  .item-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .item-date{color:var(--grey);font-family:var(--mono);font-size:13.5px}
  .item-amt{
    color:var(--navy);font-family:var(--mono);font-size:16px;font-weight:600;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .item-no{color:var(--faint);font-family:var(--mono);font-size:11.5px;margin:3px 0 0;letter-spacing:.04em}

  .deadline{color:var(--grey);font-size:12.5px;margin:18px 0 0}
  .claim{color:var(--grey);font-size:12.5px;line-height:1.75;margin:6px 0 0}
  .claim a{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .claim a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}
  .miss-body{color:var(--grey);font-size:13px;line-height:1.8;margin:8px 0 0}

  .glass{
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.14);
    border-radius:12px;padding:16px 17px 17px;margin:20px 0 0;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .tip{color:#D3E0F1;font-size:12.5px;line-height:1.85;margin:0}
  .info{margin:16px 0 0;padding:15px 0 0;border-top:1px solid rgba(255,255,255,.11)}
  .info-h{color:var(--teal);font-size:13px;font-weight:600;margin:0}
  .info-b{color:#D3E0F1;font-size:12.5px;line-height:1.9;margin:5px 0 0}
  .info-l{color:#D3E0F1;font-size:12.5px;line-height:1.9;margin:5px 0 0;padding-left:19px}
  .info-l li{margin:0 0 4px}
  .info-l li::marker{color:#8FA6C4}
  @media (prefers-reduced-motion:reduce){.stub,.stub-inner{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>統一發票中獎查詢</h1>
  <p class="period" id="period">—</p>
  <p class="lede">老闆可輸入實名制綁定的發票手機號碼查詢中獎發票。</p>

  <div class="card">
    <div class="card-top">
      <label for="phone">手機號碼</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel"
             maxlength="13" placeholder="0912345678" aria-describedby="hint">
      <p class="hint" id="hint" role="status" aria-live="polite"></p>
      <button id="go">查詢</button>
    </div>
    <div class="stub" id="stub"><div class="stub-inner" id="out"></div></div>
  </div>

  <div class="glass">
    <p class="tip">📌 若系統查詢後未顯示中獎金額，即代表本期未中獎。</p>

    <div class="info">
      <p class="info-h">🛎️ 領獎期間：</p>
      <p class="info-b">自115年8月6日起至115年11月5日前至全家便利商店列印中獎發票,以免影響領獎權益。</p>
    </div>

    <div class="info">
      <p class="info-h">📋 本站免責聲明：</p>
      <ol class="info-l">
        <li>查詢在你的手機上完成，號碼不會被傳送或留存。</li>
        <li>本服務僅供中獎紀錄查詢，實際兌獎資格以財政部規定為準。</li>
      </ol>
    </div>
  </div>
</div>

/* ═══ 以下為程式邏輯，換期時不需要更動 ══════════════════ */
const $ = id => document.getElementById(id);
$("period").textContent = CONFIG.PERIOD;

let busy = false;

function normalize(raw){
  let d = String(raw).replace(/\D/g,"");
  if (d.length === 12 && d.startsWith("8869")) d = "0" + d.slice(3);
  return d;
}
function mask(p){ return p.slice(0,4) + "-***-" + p.slice(-3); }
function money(n){ return "NT$ " + n.toLocaleString("en-US"); }

async function hashPhone(phone){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    "raw", enc.encode(phone), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name:"PBKDF2", salt:enc.encode(CONFIG.SALT),
      iterations:CONFIG.ITERATIONS, hash:"SHA-256" }, key, 128);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,"0")).join("");
}

function show(html){ $("out").innerHTML = html; $("stub").classList.add("open"); }

function renderHit(list){
  const total = list.reduce((s,r) => s + r.a, 0);
  const items = list.map(r => `
    <div class="item">
      <div class="item-row">
        <span class="item-date">${r.d}</span>
        <span class="item-amt">${money(r.a)}</span>
      </div>
      <div class="item-no">${r.n}</div>
    </div>`).join("");
  show(`
    <p class="res-title">恭喜，這期中了 ${list.length} 張</p>
    <div class="total"><span>合計</span><strong>${money(total)}</strong></div>
    <div class="rule"></div>
    ${items}
    <p class="deadline">領獎截止 ${CONFIG.DEADLINE}</p>
    <p class="claim">${CONFIG.CLAIM_NOTE}</p>`);
}

function renderMiss(){
  show(`
    <p class="res-title">這期沒有中獎</p>
    <p class="miss-body">若你確定收到中獎通知，請確認號碼與收到簡訊的號碼相同，或在 LINE 直接傳訊息給我們。</p>`);
}

async function run(){
  if (busy) return;
  const phone = normalize($("phone").value);

  if (!/^09\d{8}$/.test(phone)){
    $("hint").textContent = "請輸入 10 位數手機號碼，例如 0912345678";
    $("stub").classList.remove("open");
    return;
  }

  busy = true;
  $("hint").textContent = "";
  $("go").disabled = true;
  $("go").textContent = "查詢中…";
  $("stub").classList.remove("open");

  const hit = WINNERS[await hashPhone(phone)];
  hit ? renderHit(hit) : renderMiss();

  $("go").disabled = false;
  $("go").textContent = "查詢";
  busy = false;
}

$("go").addEventListener("click", run);
$("phone").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("phone").addEventListener("input", () => { $("hint").textContent = ""; });
</script>
